[general.plugin_registry.plugins]
  tactusharpverif = "/perm/sp3c/harmonie_release/"
[suite_control]
  suite_definition = "tactusharpverifSuiteDefinition"
[submission]
  submit_types = ["background_vm", "background_hpc", "parallel", "gnu", "serial", "tactusharpverif_group"]

[submission.tactusharpverif_group]
  SCHOST = "hpc"                             # Refers to the submission group in troika
  tasks = ["LinkOBSFCTABLES", "Verification", "Filesave"]
  WRAPPER = ""
  delay = "PT36H"  # Wait after forecast end for observations and references to become available.
  PARAMETERS = ["T2m","S10m","D10m","Pmsl","CCtot","S","D","RH","T","Q","Z","Pcp","AccPcp1h","Gmax","AccPcp3h","AccPcp6h","AccPcp12h","AccPcp24h"]

[submission.tactusharpverif_group.BATCH]
  NAME = "#SBATCH --job-name=@TASK_NAME@"
  NODES = "#SBATCH --nodes=1"
  NTASKS = "#SBATCH --ntasks=1"
  WALLTIME = "#SBATCH --time=01:05:00"

[submission.tactusharpverif_group.ENV]
  HARPSCRIPTS_HOME = "/ec/res4/hpcperm/sp3c/DE_Verification/verif_tools/oper-harp-verif_git/" # Must contain verification/point_verif.R
  VERIF_HOME= "/perm/sp3c/harmonie_release/tactusharpverif/tactus_harp_output/" # Writable root for generated configs, linked FCTABLES, RDS and plots
  REF_SQLITES="/ec/res4/scratch/snh02/DE_Verification/REF_FCTABLES/" # Shared parent directory, used if REFERENCE_MODEL_PATHS is not set
  OBSTABLES_PATH="/ec/res4/hpcperm/snh02/DE_Verification/merged_obstables_allsources/"
  REFERENCE_MODEL_NAMES=["GDT_iekm","IFS","IFSENS"] # ENS-named references are selected for ensemble runs; others for deterministic runs
  REFERENCE_MODEL_PATHS=["/ec/res4/scratch/snh02/DE_Verification/REF_FCTABLES/"] # Shared parent, or one parent per name in REFERENCE_MODEL_NAMES
  OBS_STEP=3 # Positive whole-hour observation interval used to construct HARP lead times
  Renv_conf="/perm/sp3c/harmonie_release/tactusharpverif/renv_harp/Setenv"  # Shell script that activates the HARP R environment
  ECFS_ARCHIVE_RELPATH_HARPOUTPUT="tactus/harp_outputs/cases/" # Relative ECFS destination for this case's RDS and PNG outputs

[submission.tactusharpverif_group.MODULES]
  ECFLOW = ["load", "ecflow"]

[submission.task_exceptions.LinkOBSFCTABLES.BATCH]
  WALLTIME = "#SBATCH --time=03:00:00"
[submission.task_exceptions.Verification.BATCH]
  WALLTIME = "#SBATCH --time=03:00:00"
[submission.task_exceptions.Filesave.BATCH]
  WALLTIME = "#SBATCH --time=03:00:00"
